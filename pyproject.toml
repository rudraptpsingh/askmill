[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "askmill"
version = "0.1.0a7"
description = "Run local text and vision models from code, terminal, or coding assistants."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]
mcp = ["mcp>=1.30,<2"]
mlx = ["mlx-vlm>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'"]
embedding = ["tokenizers>=0.22,<1", "psutil>=7,<8"]

[project.scripts]
askmill = "askmill.cli:main"
pdf2data-askmill = "askmill.pdf2data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.data-files]
"share/askmill/schemas" = ["schemas/*.json"]
"share/askmill/skills/askmill" = ["skills/askmill/SKILL.md"]
