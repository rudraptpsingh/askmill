name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,mcp]'
      - run: ruff check src tests examples
      - run: python -m pytest
      - run: python -m build

  pdf2data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,mcp]' 'PDF2Data[pdf,proof] @ git+https://github.com/rudraptpsingh/PDF2Data.git@9b1799e5a9474b9c2bd1ed43610b5446e15d6848'
      - run: python -m pytest tests/test_pdf2data_native.py -q
